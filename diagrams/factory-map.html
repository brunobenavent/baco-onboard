<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BACO Onboard</title>
<style>
:root { color-scheme: light dark; --bg:#0d1117; --panel:#151b23; --panel2:#1f2937; --text:#f0f6fc; --muted:#9da7b3; --line:#3d444d; --accent:#60a5fa; --planned:#fbbf24; --green:#34d399; }
* { box-sizing:border-box } body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.5 Inter,system-ui,sans-serif }
header { padding:24px 28px 18px; border-bottom:1px solid var(--line) } h1 { margin:0 0 4px; font-size:25px } header p { margin:0;color:var(--muted) }
.layout { display:grid; grid-template-columns:250px 1fr; min-height:calc(100vh - 91px) } aside { border-right:1px solid var(--line); padding:18px 12px; background:var(--panel) }
.search { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); margin-bottom:12px }
.node-link { display:block; width:100%; text-align:left; padding:8px 10px; margin:2px 0; border:0; border-radius:7px; background:none; color:var(--muted); cursor:pointer } .node-link:hover,.node-link.active { background:var(--panel2); color:var(--text) }
main { padding:22px; overflow:auto } .toolbar { display:flex; gap:8px; margin-bottom:12px; align-items:center } .toolbar button { padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--panel); color:var(--text); cursor:pointer }
.canvas { min-width:1000px; border:1px solid var(--line); border-radius:12px; background:radial-gradient(#253041 1px,transparent 1px); background-size:18px 18px; overflow:auto } svg { display:block; width:1480px; height:520px }
.node { cursor:pointer } .node rect { fill:var(--panel); stroke:var(--line); stroke-width:2 } .node:hover rect,.node.selected rect { stroke:var(--accent); stroke-width:3 } .node.kind-planned-adapter rect { stroke:var(--planned); stroke-dasharray:7 5 }
.node .kind { fill:var(--accent); font-size:12px; font-weight:600 } .node.kind-planned-adapter .kind { fill:var(--planned) } .node .label { fill:var(--text); font-size:15px; font-weight:700 } .node .hint { fill:var(--muted); font-size:11px }
.edge { fill:none; stroke:#718096; stroke-width:2 } .edge.planned { stroke:var(--planned); stroke-dasharray:7 5 } marker path { fill:#718096 }
.details { margin-top:14px; padding:16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); max-width:860px } .details h2 { margin:0 0 4px } .details p { color:var(--muted) } .source { color:var(--accent); font-family:monospace }
@media(max-width:720px) { .layout { grid-template-columns:1fr } aside { border-right:0; border-bottom:1px solid var(--line) } .node-link { display:inline-block; width:auto } }
</style></head><body>
<header><h1>BACO Onboard</h1><p>Mapa de la fábrica de automatización de procesos</p></header>
<div class="layout"><aside><input id="search" class="search" placeholder="Buscar un nodo…" aria-label="Buscar un nodo"><nav id="node-list"><button class="node-link" data-id="input">Petición</button><button class="node-link" data-id="excel">ExcelArticleReader</button><button class="node-link" data-id="workflow">PrepareCampaignWorkflow</button><button class="node-link" data-id="domain">WorkItem + CampaignRequest</button><button class="node-link" data-id="repository">JsonWorkRepository</button><button class="node-link" data-id="approval">Aprobación humana</button><button class="node-link" data-id="mailchimp">MailchimpCampaignSender</button><button class="node-link" data-id="sage">SageAdapter</button></nav></aside>
<main><div class="toolbar"><button id="reset">Vista general</button><span id="status" aria-live="polite"></span></div><div class="canvas"><svg viewBox="0 0 1480 520" aria-label="Mapa de BACO Onboard">
      <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
      <g class="edges"><path class="edge" d="M 250 218 H 430.0 V 218 H 610" marker-end="url(#arrow)"/><path class="edge" d="M 530 128 H 570.0 V 218 H 610" marker-end="url(#arrow)"/><path class="edge" d="M 820 218 H 715.0 V 398 H 610" marker-end="url(#arrow)"/><path class="edge" d="M 820 398 H 875.0 V 398 H 930" marker-end="url(#arrow)"/><path class="edge" d="M 820 218 H 875.0 V 218 H 930" marker-end="url(#arrow)"/><path class="edge" d="M 1140 218 H 1180.0 V 218 H 1220" marker-end="url(#arrow)"/><path class="edge planned" d="M 820 218 H 1020.0 V 398 H 1220" marker-end="url(#arrow)"/></g><g class="nodes"><g class="node kind-entrada" data-id="input" tabindex="0" role="button"><rect x="40" y="170" width="210" height="96" rx="12"/><text class="kind" x="54" y="191">Entrada</text><text class="label" x="54" y="219">Petición</text><text class="hint" x="54" y="243">Seleccionar</text></g><g class="node kind-adapter" data-id="excel" tabindex="0" role="button"><rect x="320" y="80" width="210" height="96" rx="12"/><text class="kind" x="334" y="101">Adapter</text><text class="label" x="334" y="129">ExcelArticleReader</text><text class="hint" x="334" y="153">Seleccionar</text></g><g class="node kind-skill---workflow" data-id="workflow" tabindex="0" role="button"><rect x="610" y="170" width="210" height="96" rx="12"/><text class="kind" x="624" y="191">Skill / Workflow</text><text class="label" x="624" y="219">PrepareCampaignWorkflow</text><text class="hint" x="624" y="243">Seleccionar</text></g><g class="node kind-dominio" data-id="domain" tabindex="0" role="button"><rect x="610" y="350" width="210" height="96" rx="12"/><text class="kind" x="624" y="371">Dominio</text><text class="label" x="624" y="399">WorkItem + CampaignRequest</text><text class="hint" x="624" y="423">Seleccionar</text></g><g class="node kind-repository" data-id="repository" tabindex="0" role="button"><rect x="930" y="350" width="210" height="96" rx="12"/><text class="kind" x="944" y="371">Repository</text><text class="label" x="944" y="399">JsonWorkRepository</text><text class="hint" x="944" y="423">Seleccionar</text></g><g class="node kind-control" data-id="approval" tabindex="0" role="button"><rect x="930" y="170" width="210" height="96" rx="12"/><text class="kind" x="944" y="191">Control</text><text class="label" x="944" y="219">Aprobación humana</text><text class="hint" x="944" y="243">Seleccionar</text></g><g class="node kind-planned-adapter" data-id="mailchimp" tabindex="0" role="button"><rect x="1220" y="170" width="210" height="96" rx="12"/><text class="kind" x="1234" y="191">Planned adapter</text><text class="label" x="1234" y="219">MailchimpCampaignSender</text><text class="hint" x="1234" y="243">Seleccionar</text></g><g class="node kind-planned-adapter" data-id="sage" tabindex="0" role="button"><rect x="1220" y="350" width="210" height="96" rx="12"/><text class="kind" x="1234" y="371">Planned adapter</text><text class="label" x="1234" y="399">SageAdapter</text><text class="hint" x="1234" y="423">Seleccionar</text></g></g>
    </svg></div><section id="details" class="details" aria-live="polite"><h2>Selecciona una parte</h2><p>Elige un nodo en el mapa o en la lista lateral.</p></section></main></div>
<script>const NODES=[{"id": "input", "label": "Petición", "kind": "Entrada", "x": 40, "y": 170, "description": "Una petición normalizada con asunto, audiencia, origen y referencia. Puede llegar desde GitHub, un chat o un formulario.", "source": "src/fabrica/domain.py"}, {"id": "excel", "label": "ExcelArticleReader", "kind": "Adapter", "x": 320, "y": 80, "description": "Lee el Excel y exige las columnas title, description, url e image_url.", "source": "src/fabrica/adapters/excel.py"}, {"id": "workflow", "label": "PrepareCampaignWorkflow", "kind": "Skill / Workflow", "x": 610, "y": 170, "description": "Coordina la preparación: lee artículos, valida el resultado y crea un trabajo pendiente de aprobación.", "source": "src/fabrica/workflows.py"}, {"id": "domain", "label": "WorkItem + CampaignRequest", "kind": "Dominio", "x": 610, "y": 350, "description": "Modelo interno que conserva la petición, el estado, los errores y la evidencia.", "source": "src/fabrica/domain.py"}, {"id": "repository", "label": "JsonWorkRepository", "kind": "Repository", "x": 930, "y": 350, "description": "Guarda los trabajos como JSON. Más adelante puede sustituirse por SQLite o PostgreSQL.", "source": "src/fabrica/repositories.py"}, {"id": "approval", "label": "Aprobación humana", "kind": "Control", "x": 930, "y": 170, "description": "El envío permanece bloqueado hasta una aprobación explícita.", "source": "src/fabrica/workflows.py"}, {"id": "mailchimp", "label": "MailchimpCampaignSender", "kind": "Planned adapter", "x": 1220, "y": 170, "description": "Punto de extensión para programar o enviar la campaña. Todavía no está conectado.", "source": "src/fabrica/ports.py"}, {"id": "sage", "label": "SageAdapter", "kind": "Planned adapter", "x": 1220, "y": 350, "description": "Futura conexión para buscar y subir albaranes en Sage.", "source": "planned"}];const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));const nodes=[...document.querySelectorAll('.node')];const links=[...document.querySelectorAll('.node-link')];const details=document.getElementById('details');
function select(id,update=true){const n=byId[id];if(!n)return;nodes.forEach(x=>x.classList.toggle('selected',x.dataset.id===id));links.forEach(x=>x.classList.toggle('active',x.dataset.id===id));details.innerHTML=`<h2>${n.label}</h2><p><strong>${n.kind}</strong></p><p>${n.description}</p><div class="source">Fuente: ${n.source}</div>`;if(update)history.replaceState(null,'','#view='+encodeURIComponent(id));}
nodes.forEach(n=>n.addEventListener('click',()=>select(n.dataset.id)));nodes.forEach(n=>n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')select(n.dataset.id)}));links.forEach(n=>n.addEventListener('click',()=>select(n.dataset.id)));
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();links.forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q));});document.getElementById('reset').addEventListener('click',()=>{history.replaceState(null,'',location.pathname);nodes.forEach(x=>x.classList.remove('selected'));links.forEach(x=>x.classList.remove('active'));details.innerHTML='<h2>Vista general</h2><p>La fábrica recibe una petición, ejecuta un workflow, guarda evidencia y detiene los efectos externos hasta la aprobación.</p>';});const initial=decodeURIComponent(location.hash.replace('#view=',''));if(initial)select(initial,false);</script></body></html>
