<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BACO Onboard</title>
<style>
:root { color-scheme: light dark; --bg:#0d1117; --panel:#151b23; --panel2:#1f2937; --text:#f0f6fc; --muted:#9da7b3; --line:#3d444d; --accent:#60a5fa; --planned:#fbbf24; --green:#34d399; }
* { box-sizing:border-box } body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.5 Inter,system-ui,sans-serif }
header { padding:24px 28px 18px; border-bottom:1px solid var(--line) } h1 { margin:0 0 4px; font-size:25px } header p { margin:0;color:var(--muted) }
.layout { display:grid; grid-template-columns:250px 1fr; min-height:calc(100vh - 91px) } aside { border-right:1px solid var(--line); padding:18px 12px; background:var(--panel) }
.search { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); margin-bottom:12px }
.node-link { display:block; width:100%; text-align:left; padding:8px 10px; margin:2px 0; border:0; border-radius:7px; background:none; color:var(--muted); cursor:pointer } .node-link:hover,.node-link.active { background:var(--panel2); color:var(--text) }
main { padding:22px; overflow:auto } .toolbar { display:flex; gap:8px; margin-bottom:12px; align-items:center } .toolbar button { padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--panel); color:var(--text); cursor:pointer }
.canvas { min-width:1000px; border:1px solid var(--line); border-radius:12px; background:radial-gradient(#253041 1px,transparent 1px); background-size:18px 18px; overflow:auto } svg { display:block; width:2020px; height:520px }
.node { cursor:pointer } .node rect { fill:var(--panel); stroke:var(--line); stroke-width:2 } .node:hover rect,.node.selected rect { stroke:var(--accent); stroke-width:3 } .node.kind-planned-adapter rect { stroke:var(--planned); stroke-dasharray:7 5 }
.node .kind { fill:var(--accent); font-size:12px; font-weight:600 } .node.kind-planned-adapter .kind { fill:var(--planned) } .node .label { fill:var(--text); font-size:15px; font-weight:700 } .node .hint { fill:var(--muted); font-size:11px }
.edge { fill:none; stroke:#718096; stroke-width:2 } .edge.planned { stroke:var(--planned); stroke-dasharray:7 5 } marker path { fill:#718096 }
.details { margin-top:14px; padding:16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); max-width:860px } .details h2 { margin:0 0 4px } .details p { color:var(--muted) } .source { color:var(--accent); font-family:monospace }
@media(max-width:720px) { .layout { grid-template-columns:1fr } aside { border-right:0; border-bottom:1px solid var(--line) } .node-link { display:inline-block; width:auto } }
</style></head><body>
<header><h1>BACO Onboard</h1><p>Fábrica agnóstica de automatización de procesos internos</p></header>
<div class="layout"><aside><input id="search" class="search" placeholder="Buscar un nodo…" aria-label="Buscar un nodo"><nav id="node-list"><button class="node-link" data-id="channels">Canales de entrada</button><button class="node-link" data-id="intake">Petición normalizada</button><button class="node-link" data-id="case">Expediente durable</button><button class="node-link" data-id="catalog">Catálogo de procedimientos</button><button class="node-link" data-id="agent">Agente copiloto</button><button class="node-link" data-id="policy">Política y severidad</button><button class="node-link" data-id="approval">Intervención humana</button><button class="node-link" data-id="contract">Contrato de herramienta</button><button class="node-link" data-id="adapters">Adapters externos</button><button class="node-link" data-id="evidence">Resultado y auditoría</button><button class="node-link" data-id="campaign">Preparar campaña</button><button class="node-link" data-id="document">Procesar documento</button></nav></aside>
<main><div class="toolbar"><button id="reset">Vista general</button><span id="status" aria-live="polite"></span></div><div class="canvas"><svg viewBox="0 0 1980 520" aria-label="Mapa de BACO Onboard">
      <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
      <g class="edges"><path class="edge" d="M 250 178 H 285.0 V 178 H 320" marker-end="url(#arrow)"/><path class="edge" d="M 530 178 H 565.0 V 178 H 600" marker-end="url(#arrow)"/><path class="edge" d="M 810 178 H 845.0 V 88 H 880" marker-end="url(#arrow)"/><path class="edge" d="M 1090 88 H 985.0 V 258 H 880" marker-end="url(#arrow)"/><path class="edge" d="M 1090 258 H 1125.0 V 88 H 1160" marker-end="url(#arrow)"/><path class="edge" d="M 1370 88 H 1265.0 V 258 H 1160" marker-end="url(#arrow)"/><path class="edge" d="M 1370 88 H 1405.0 V 178 H 1440" marker-end="url(#arrow)"/><path class="edge" d="M 1370 258 H 1405.0 V 178 H 1440" marker-end="url(#arrow)"/><path class="edge planned" d="M 1650 178 H 1685.0 V 178 H 1720" marker-end="url(#arrow)"/><path class="edge planned" d="M 1930 178 H 1685.0 V 378 H 1440" marker-end="url(#arrow)"/><path class="edge" d="M 810 178 H 1125.0 V 378 H 1440" marker-end="url(#arrow)"/><path class="edge" d="M 1090 88 H 845.0 V 398 H 600" marker-end="url(#arrow)"/><path class="edge planned" d="M 1090 88 H 985.0 V 438 H 880" marker-end="url(#arrow)"/></g><g class="nodes"><g class="node kind-entrada" data-id="channels" tabindex="0" role="button"><rect x="40" y="130" width="210" height="96" rx="12"/><text class="kind" x="54" y="151">Entrada</text><text class="label" x="54" y="179">Canales de entrada</text><text class="hint" x="54" y="203">Seleccionar</text></g><g class="node kind-núcleo" data-id="intake" tabindex="0" role="button"><rect x="320" y="130" width="210" height="96" rx="12"/><text class="kind" x="334" y="151">Núcleo</text><text class="label" x="334" y="179">Petición normalizada</text><text class="hint" x="334" y="203">Seleccionar</text></g><g class="node kind-núcleo" data-id="case" tabindex="0" role="button"><rect x="600" y="130" width="210" height="96" rx="12"/><text class="kind" x="614" y="151">Núcleo</text><text class="label" x="614" y="179">Expediente durable</text><text class="hint" x="614" y="203">Seleccionar</text></g><g class="node kind-procedimientos" data-id="catalog" tabindex="0" role="button"><rect x="880" y="40" width="210" height="96" rx="12"/><text class="kind" x="894" y="61">Procedimientos</text><text class="label" x="894" y="89">Catálogo de procedimientos</text><text class="hint" x="894" y="113">Seleccionar</text></g><g class="node kind-coordinación" data-id="agent" tabindex="0" role="button"><rect x="880" y="210" width="210" height="96" rx="12"/><text class="kind" x="894" y="231">Coordinación</text><text class="label" x="894" y="259">Agente copiloto</text><text class="hint" x="894" y="283">Seleccionar</text></g><g class="node kind-control" data-id="policy" tabindex="0" role="button"><rect x="1160" y="40" width="210" height="96" rx="12"/><text class="kind" x="1174" y="61">Control</text><text class="label" x="1174" y="89">Política y severidad</text><text class="hint" x="1174" y="113">Seleccionar</text></g><g class="node kind-control" data-id="approval" tabindex="0" role="button"><rect x="1160" y="210" width="210" height="96" rx="12"/><text class="kind" x="1174" y="231">Control</text><text class="label" x="1174" y="259">Intervención humana</text><text class="hint" x="1174" y="283">Seleccionar</text></g><g class="node kind-seam" data-id="contract" tabindex="0" role="button"><rect x="1440" y="130" width="210" height="96" rx="12"/><text class="kind" x="1454" y="151">Seam</text><text class="label" x="1454" y="179">Contrato de herramienta</text><text class="hint" x="1454" y="203">Seleccionar</text></g><g class="node kind-planned" data-id="adapters" tabindex="0" role="button"><rect x="1720" y="130" width="210" height="96" rx="12"/><text class="kind" x="1734" y="151">Planned</text><text class="label" x="1734" y="179">Adapters externos</text><text class="hint" x="1734" y="203">Seleccionar</text></g><g class="node kind-núcleo" data-id="evidence" tabindex="0" role="button"><rect x="1440" y="330" width="210" height="96" rx="12"/><text class="kind" x="1454" y="351">Núcleo</text><text class="label" x="1454" y="379">Resultado y auditoría</text><text class="hint" x="1454" y="403">Seleccionar</text></g><g class="node kind-caso-de-prueba" data-id="campaign" tabindex="0" role="button"><rect x="600" y="350" width="210" height="96" rx="12"/><text class="kind" x="614" y="371">Caso de prueba</text><text class="label" x="614" y="399">Preparar campaña</text><text class="hint" x="614" y="423">Seleccionar</text></g><g class="node kind-futuro" data-id="document" tabindex="0" role="button"><rect x="880" y="390" width="210" height="96" rx="12"/><text class="kind" x="894" y="411">Futuro</text><text class="label" x="894" y="439">Procesar documento</text><text class="hint" x="894" y="463">Seleccionar</text></g></g>
    </svg></div><section id="details" class="details" aria-live="polite"><h2>Selecciona una parte</h2><p>Elige un nodo en el mapa o en la lista lateral.</p></section></main></div>
<script>const NODES=[{"id": "channels", "label": "Canales de entrada", "kind": "Entrada", "x": 40, "y": 130, "description": "WhatsApp, Telegram, email y programación automática. Cada canal crea o alimenta un expediente.", "source": "docs/architecture.md"}, {"id": "intake", "label": "Petición normalizada", "kind": "Núcleo", "x": 320, "y": 130, "description": "Convierte mensajes, archivos o eventos en una petición común sin depender del canal original.", "source": "GLOSSARY.md"}, {"id": "case", "label": "Expediente durable", "kind": "Núcleo", "x": 600, "y": 130, "description": "Fuente de verdad de BACO: identidad, contexto, estado, acciones, decisiones, evidencia y resultado.", "source": "src/fabrica/domain.py"}, {"id": "catalog", "label": "Catálogo de procedimientos", "kind": "Procedimientos", "x": 880, "y": 40, "description": "Procedimientos versionados, con propietario, entradas, políticas, severidad y salidas.", "source": "skills/prepare-campaign/SKILL.md"}, {"id": "agent", "label": "Agente copiloto", "kind": "Coordinación", "x": 880, "y": 210, "description": "Propone procedimientos, pide información y coordina pasos permitidos. No inventa ni salta políticas.", "source": "docs/architecture.md"}, {"id": "policy", "label": "Política y severidad", "kind": "Control", "x": 1160, "y": 40, "description": "Determina permisos, simulación, aprobación humana, caducidad y bloqueo de acciones desconocidas.", "source": "GLOSSARY.md"}, {"id": "approval", "label": "Intervención humana", "kind": "Control", "x": 1160, "y": 210, "description": "Permite aprobar, rechazar, pedir corrección o pedir más información según el umbral.", "source": "docs/architecture.md"}, {"id": "contract", "label": "Contrato de herramienta", "kind": "Seam", "x": 1440, "y": 130, "description": "Interfaz común de entradas, salidas, permisos, errores e idempotencia.", "source": "GLOSSARY.md"}, {"id": "adapters", "label": "Adapters externos", "kind": "Planned", "x": 1720, "y": 130, "description": "MCP, API, SDK o CLI para conectar correo, documentos, comunicaciones, ERP y otros sistemas.", "source": "src/fabrica/ports.py"}, {"id": "evidence", "label": "Resultado y auditoría", "kind": "Núcleo", "x": 1440, "y": 330, "description": "Notifica el resultado y conserva una línea temporal completa, incluso en fallos o bloqueos.", "source": "docs/architecture.md"}, {"id": "campaign", "label": "Preparar campaña", "kind": "Caso de prueba", "x": 600, "y": 350, "description": "Primer procedimiento concreto: lee y valida artículos desde Excel y deja la campaña pendiente de aprobación.", "source": "src/fabrica/workflows.py"}, {"id": "document", "label": "Procesar documento", "kind": "Futuro", "x": 880, "y": 390, "description": "Procedimiento futuro para recibir, clasificar, extraer y registrar documentos empresariales.", "source": "docs/architecture.md"}];const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));const nodes=[...document.querySelectorAll('.node')];const links=[...document.querySelectorAll('.node-link')];const details=document.getElementById('details');
function select(id,update=true){const n=byId[id];if(!n)return;nodes.forEach(x=>x.classList.toggle('selected',x.dataset.id===id));links.forEach(x=>x.classList.toggle('active',x.dataset.id===id));details.innerHTML=`<h2>${n.label}</h2><p><strong>${n.kind}</strong></p><p>${n.description}</p><div class="source">Fuente: ${n.source}</div>`;if(update)history.replaceState(null,'','#view='+encodeURIComponent(id));}
nodes.forEach(n=>n.addEventListener('click',()=>select(n.dataset.id)));nodes.forEach(n=>n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')select(n.dataset.id)}));links.forEach(n=>n.addEventListener('click',()=>select(n.dataset.id)));
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();links.forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q));});document.getElementById('reset').addEventListener('click',()=>{history.replaceState(null,'',location.pathname);nodes.forEach(x=>x.classList.remove('selected'));links.forEach(x=>x.classList.remove('active'));details.innerHTML='<h2>Vista general</h2><p>La fábrica recibe una petición, ejecuta un workflow, guarda evidencia y detiene los efectos externos hasta la aprobación.</p>';});const initial=decodeURIComponent(location.hash.replace('#view=',''));if(initial)select(initial,false);</script></body></html>
