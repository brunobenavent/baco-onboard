[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baco-onboard"
version = "0.1.0"
description = "Fábrica Python de automatización de procesos con aprobación y evidencia"
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
baco = "fabrica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
